{% extends 'core/base.html' %}

{% block content %}
<h2>Edit Product</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <p>Name:<br><input type="text" name="name" value="{{ product.name }}"></p>
    <p>Description:<br><textarea name="description">{{ product.description }}</textarea></p>
    <p>Price:<br><input type="number" step="0.01" name="price" value="{{ product.price }}"></p>
    <p>Stock:<br><input type="number" name="stock" value="{{ product.stock }}"></p>

    <p>Current Image:<br>
        {% if product.image %}
            <img src="{{ product.image.url }}" width="80">
        {% endif %}
    </p>

    <p>Change Image:<br><input type="file" name="image"></p>

    <button type="submit" class="btn">Update</button>
</form>
{% endblock %}
