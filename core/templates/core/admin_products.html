{% extends 'core/base.html' %}

{% block content %}
<h2>Manage Products</h2>

<a href="/admin-products/add/" class="btn" style="margin-bottom:15px;">+ Add Product</a>

<table style="width:100%; border-collapse: collapse; background:white;">
    <tr style="background:#1f4e79; color:white;">
        <th style="padding:10px;">Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
    </tr>

    {% for product in products %}
    <tr style="border-bottom:1px solid #ddd;">
        <td style="padding:10px;">
            {% if product.image %}
                <img src="{{ product.image.url }}" style="width:60px;">
            {% endif %}
        </td>
        <td>{{ product.name }}</td>
        <td>RM {{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
            <a href="/admin-products/edit/{{ product.id }}/" class="btn">Edit</a>
            <a href="/admin-products/delete/{{ product.id }}/"
               class="btn" style="background:#dc3545;">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
