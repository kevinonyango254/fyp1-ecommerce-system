<!DOCTYPE html>
<html>
<head>
    <title>GoBuy AI Chatbot</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:40px;
        }

        .chat-container{
            max-width:800px;
            margin:auto;
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        #messages{
            height:450px;
            overflow-y:auto;
            border:1px solid #ddd;
            padding:15px;
            margin-bottom:15px;
            background:#fafafa;
        }

        .user{
            color:#0066cc;
            margin-bottom:10px;
        }

        .bot{
            color:#198754;
            margin-bottom:15px;
        }

        input{
            width:80%;
            padding:10px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <h2>🤖 GoBuy AI Assistant</h2>

    <div id="messages"></div>

    <input
        type="text"
        id="message"
        placeholder="Ask me anything..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

</div>

<script>

async function sendMessage(){

    const input=document.getElementById("message");

    const messages=document.getElementById("messages");

    const text=input.value.trim();

    if(text==="") return;

    messages.innerHTML += `<div class="user"><b>You:</b> ${text}</div>`;

    input.value="";

    const response=await fetch("/chatbot/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:text
        })

    });

    const data=await response.json();

    if(data.reply){

        messages.innerHTML += `<div class="bot"><b>AI:</b> ${data.reply}</div>`;

    }else{

        messages.innerHTML += `<div class="bot"><b>Error:</b> ${data.error}</div>`;

    }

    messages.scrollTop=messages.scrollHeight;

}

</script>

</body>
</html>
