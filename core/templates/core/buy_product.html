{% extends 'core/base.html' %}

{% block title %}Buy Product{% endblock %}

{% block content %}
    <h1>Buy {{ product.name }}</h1>

    <p><strong>Price:</strong> RM {{ product.price }}</p>
    <p><strong>Available Stock:</strong> {{ product.stock }}</p>

    {% if error %}
        <p style="color:red;"><strong>{{ error }}</strong></p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Customer Name:</label><br>
        <input type="text" name="customer_name" required><br>

        <label>Customer Email:</label><br>
        <input type="email" name="customer_email" required><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" min="1" required><br>

        <button type="submit" class="btn">Confirm Payment</button>
    </form>

    <br>
    <a href="/products/{{ product.id }}/" class="btn">Back to Product</a>
{% endblock %}
