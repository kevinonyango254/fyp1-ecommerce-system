{% extends 'core/base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">
    <h2 style="margin-bottom: 10px; color: #1f4e79;">Set New Password</h2>
    <p style="color: #555; margin-bottom: 25px;">
        Enter your new password below.
    </p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">Reset Password</button>
    </form>
</div>
{% endblock %}
