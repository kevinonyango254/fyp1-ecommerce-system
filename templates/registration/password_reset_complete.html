{% extends 'core/base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); text-align: center;">
    <h2 style="margin-bottom: 10px; color: #1f4e79;">Password Reset Complete</h2>
    <p style="color: #555; margin-bottom: 20px;">
        Your password has been set successfully. You can now log in with your new password.
    </p>

    <a href="/login/" class="btn">Go to Login</a>
</div>
{% endblock %}
